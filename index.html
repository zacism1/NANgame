<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAN Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/shared.css" />
  <link rel="stylesheet" href="styles/hub.css" />
</head>
<body>
  <div class="hub-page">
    <header class="hub-hero">
      <div class="hub-avatar-wrap">
        <div class="hub-avatar-ring"></div>
        <img class="hub-avatar" src="assets/nan/portrait.jpg" alt="Nan" />
      </div>
      <div class="hub-hero-text">
        <h1 class="hub-title">NAN Arcade</h1>
        <p class="hub-tagline">A collection of games starring Nan. Pick a game below and jump in.</p>
      </div>
    </header>

    <section>
      <div class="hub-section-title">Games</div>
      <div class="game-grid" id="gameGrid"></div>
    </section>

    <footer class="hub-footer">
      NAN Arcade — more games coming soon.
    </footer>
  </div>

  <script src="js/hub.js"></script>
</body>
</html>
