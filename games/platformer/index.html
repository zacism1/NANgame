<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102a56">
  <title>Super NAN Bros</title>
  <style>
    :root {
      --sky: #5c94fc;
      --navy: #102a56;
      --cream: #fff8e8;
      --gold: #ffd84a;
      --orange: #ef6a24;
      --orange-dark: #9d351d;
      --green: #43a047;
      --panel: rgba(11, 32, 70, .94);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #081b3b;
      color: var(--cream);
      font-family: "Arial Black", Impact, system-ui, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      background-color: #081b3b;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.035) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    #game-shell {
      position: relative;
      width: min(100vw, calc(100dvh * 2 / 3), 480px);
      height: min(100dvh, calc(100vw * 3 / 2), 720px);
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
      background: var(--sky);
      box-shadow: 0 0 0 3px #061733, 0 20px 70px rgba(0,0,0,.55);
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #mute-btn {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: 10px;
      z-index: 12;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 3px solid var(--navy);
      border-radius: 8px;
      background: rgba(255,248,232,.9);
      box-shadow: 0 4px 0 var(--navy);
      color: var(--navy);
      font: 700 19px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    #mute-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
    #game-shell.playing #mute-btn { top: calc(70px + env(safe-area-inset-top)); }

    #screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(54px, env(safe-area-inset-top)) 26px max(28px, env(safe-area-inset-bottom));
      text-align: center;
      background: linear-gradient(rgba(44,115,225,.08), rgba(6,31,73,.44));
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    #screen.visible { opacity: 1; pointer-events: auto; }

    .panel {
      width: 100%;
      max-width: 405px;
      padding: 24px 20px 22px;
      border: 4px solid var(--navy);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.08), 0 8px 0 rgba(4,18,46,.72);
    }

    .game-logo {
      margin: 0 0 16px;
      color: var(--cream);
      font-size: clamp(38px, 11vw, 59px);
      line-height: .84;
      letter-spacing: -1px;
      text-transform: uppercase;
      -webkit-text-stroke: 3px var(--navy);
      paint-order: stroke fill;
      filter: drop-shadow(0 6px 0 var(--orange));
    }

    .game-logo span { display: block; }

    #screen-kicker {
      min-height: 18px;
      margin: 0 0 8px;
      color: var(--gold);
      font: 800 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    #screen-title {
      margin: 0 0 12px;
      color: #fff;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.05;
      text-shadow: 0 3px 0 #061733;
    }

    #screen-copy {
      max-width: 340px;
      margin: 0 auto 19px;
      color: #eaf3ff;
      font: 700 clamp(14px, 3.9vw, 17px)/1.45 system-ui, sans-serif;
    }

    #screen-help {
      margin: 15px 0 0;
      color: #bcd4ff;
      font: 700 12px/1.45 system-ui, sans-serif;
    }

    #screen-actions { display: grid; gap: 12px; width: 100%; }

    .menu-btn {
      width: 100%;
      min-height: 58px;
      padding: 11px 16px;
      border: 4px solid var(--navy);
      border-radius: 9px;
      background: var(--orange);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.2), 0 5px 0 var(--orange-dark);
      color: #fff;
      font: 900 19px/1.05 "Arial Black", Impact, system-ui, sans-serif;
      letter-spacing: .3px;
      text-shadow: 0 2px 0 var(--orange-dark);
      cursor: pointer;
    }

    .menu-btn.secondary {
      background: #f7f0d4;
      color: var(--navy);
      text-shadow: none;
      box-shadow: inset 0 0 0 3px #fff, 0 5px 0 #a9b5c8;
    }

    .menu-btn:hover { filter: brightness(1.08); }
    .menu-btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
    .menu-btn:active { transform: translateY(4px); box-shadow: inset 0 0 0 3px rgba(255,255,255,.2), 0 1px 0 var(--orange-dark); }

    #touch-controls {
      position: absolute;
      inset: auto 0 max(12px, env(safe-area-inset-bottom)) 0;
      z-index: 8;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 17px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    #touch-controls.active { opacity: 1; pointer-events: auto; }
    .dpad { display: flex; gap: 10px; }

    .control-btn {
      display: grid;
      place-items: center;
      width: clamp(64px, 17vw, 79px);
      height: clamp(64px, 17vw, 79px);
      padding: 0;
      border: 4px solid #fff;
      border-radius: 50%;
      background: rgba(37,105,218,.85);
      box-shadow: 0 0 0 4px var(--navy), inset 0 0 0 3px rgba(255,255,255,.22), 0 6px 0 rgba(6,23,51,.85);
      color: #fff;
      font: 900 33px/1 system-ui, sans-serif;
      text-shadow: 0 2px 0 var(--navy);
      touch-action: none;
    }

    #jump-btn {
      width: clamp(82px, 22vw, 98px);
      height: clamp(82px, 22vw, 98px);
      border-radius: 50%;
      background: rgba(239,86,34,.9);
      font: 900 clamp(12px, 3.4vw, 16px)/1 system-ui, sans-serif;
      letter-spacing: .2px;
    }

    .control-btn.pressed,
    .control-btn:active { transform: translateY(5px) scale(.98); box-shadow: 0 0 0 4px var(--navy), inset 0 0 0 3px rgba(255,255,255,.22), 0 1px 0 rgba(6,23,51,.85); }

    @media (hover: hover) and (pointer: fine) {
      #touch-controls.active { opacity: .68; }
      #touch-controls.active:hover { opacity: 1; }
    }

    /* Tall phones get a full-height shell: the 2:3 game view stays crisp at
       the top while the remaining screen becomes a dedicated thumb deck. */
    @media (max-width: 600px) and (min-height: 650px) and (orientation: portrait) {
      body { place-items: stretch center; }

      #game-shell {
        width: min(100vw, 480px);
        height: 100dvh;
        min-height: 0;
        background-color: #081b3b;
        background-image:
          linear-gradient(45deg, rgba(255,255,255,.035) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(255,255,255,.035) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(255,255,255,.035) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.035) 75%);
        background-size: 22px 22px;
        background-position: 0 0, 0 11px, 11px -11px, -11px 0;
        box-shadow: none;
      }

      canvas {
        inset: env(safe-area-inset-top) 0 auto;
        width: 100%;
        height: auto;
      }

      #game-shell.playing::after {
        content: "";
        position: absolute;
        z-index: 1;
        inset: calc(env(safe-area-inset-top) + min(150vw, 720px)) 0 0;
        border-top: 3px solid rgba(255,255,255,.12);
        background: linear-gradient(180deg, rgba(15,45,92,.96), rgba(6,24,55,.99));
        box-shadow: inset 0 8px 24px rgba(0,0,0,.22);
      }

      #screen {
        padding: max(24px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom));
        background: linear-gradient(rgba(44,115,225,.16), rgba(6,31,73,.82));
      }

      #touch-controls {
        bottom: max(18px, env(safe-area-inset-bottom));
        padding: 0 24px;
      }

      .control-btn {
        width: clamp(70px, 20vw, 86px);
        height: clamp(70px, 20vw, 86px);
      }

      #jump-btn {
        width: clamp(92px, 25vw, 106px);
        height: clamp(92px, 25vw, 106px);
      }
    }

    @media (max-width: 600px) and (min-height: 650px) and (max-height: 719px) and (orientation: portrait) {
      #touch-controls {
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 0 18px;
      }

      .control-btn {
        width: clamp(64px, 18vw, 72px);
        height: clamp(64px, 18vw, 72px);
      }

      #jump-btn {
        width: clamp(82px, 23vw, 92px);
        height: clamp(82px, 23vw, 92px);
      }
    }

    @media (max-width: 600px) and (min-height: 760px) and (orientation: portrait) {
      #game-shell.playing #mute-btn {
        top: calc(env(safe-area-inset-top) + min(150vw, 720px) + 16px);
        right: 16px;
      }
    }

    @media (max-height: 540px) {
      .panel { padding: 15px 17px; }
      .game-logo { margin-bottom: 10px; font-size: 36px; }
      #screen-copy { margin-bottom: 12px; }
      #screen-help { display: none; }
      .menu-btn { min-height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #screen, #touch-controls { transition: none; }
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Super NAN Bros game">
    <canvas id="game" width="480" height="720" tabindex="0" aria-label="Super NAN Bros platform game"></canvas>

    <button id="mute-btn" type="button" aria-label="Mute sound">🔊</button>

    <section id="screen" class="visible" aria-live="polite">
      <div class="panel">
        <h1 class="game-logo"><span>SUPER</span><span>NAN BROS</span></h1>
        <p id="screen-kicker"></p>
        <h2 id="screen-title">Choose your language</h2>
        <p id="screen-copy">Nan's food-rescue adventure is ready.</p>
        <div id="screen-actions">
          <button class="menu-btn" type="button" data-language="en">ENGLISH</button>
          <button class="menu-btn secondary" type="button" data-language="th">ไทย</button>
        </div>
        <p id="screen-help">🔊 Sound starts when you play</p>
      </div>
    </section>

    <nav id="touch-controls" aria-label="Game controls">
      <div class="dpad">
        <button id="left-btn" class="control-btn" type="button" aria-label="Move left">◀</button>
        <button id="right-btn" class="control-btn" type="button" aria-label="Move right">▶</button>
      </div>
      <button id="jump-btn" class="control-btn" type="button" aria-label="Jump">JUMP</button>
    </nav>
  </main>

    const t = () => COPY[language || 'en'];

    const makePlatform = (x, y, w, h = 180, kind = 'ground') => ({ x, y, w, h, kind });

    // -----------------------------------------------------------------------
    // Game state and audio
    // -----------------------------------------------------------------------
    const game = {
      state: 'language',
      levelIndex: 0,
      score: 0,
      lives: 3,
      collected: 0,
      jumpCount: 0,
      jumpPeakY: 526,
      level: null,
      cameraX: 0,
      shake: 0,
      time: 0,
      readyTimer: 0,
      particles: [],

    };

    const player = {
      x: 74, y: 500, prevY: 500,
      w: 34, h: 48,
      vx: 0, vy: 0,
      onGround: false,
      coyote: 0,
      jumpBuffer: 0,

    };

    const input = { left: false, right: false, jump: false, jumpPressed: false, jumpReleased: false };
    const activePointers = { left: new Set(), right: new Set(), jump: new Set() };

    let audioContext = null;
    let masterGain = null;
    let musicTimer = null;
    let musicStep = 0;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioContext.createGain();
        masterGain.gain.value = game.muted ? 0 : .18;
        masterGain.connect(audioContext.destination);
      }
      if (audioContext.state === 'suspended') audioContext.resume();
      if (!musicTimer) {
        musicTimer = window.setInterval(playMusicStep, 155);
      }
    }

    function tone(frequency, duration = .09, type = 'square', volume = .16, delay = 0) {
      if (!audioContext || game.muted) return;
      const start = audioContext.currentTime + delay;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(.001, start + duration);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(start);
      osc.stop(start + duration + .02);
    }

    function sfx(name) {
      if (name === 'jump') { tone(390, .08, 'square', .22); tone(590, .09, 'square', .14, .05); }
      if (name === 'doubleJump') { tone(620, .07, 'square', .2); tone(930, .1, 'square', .15, .045); }
      if (name === 'food') { tone(880, .05, 'square', .2); tone(1320, .08, 'square', .18, .045); }
      if (name === 'stomp') { tone(160, .08, 'sawtooth', .2); tone(320, .08, 'square', .16, .055); }
      if (name === 'hurt') { tone(170, .28, 'sawtooth', .2); tone(95, .35, 'square', .16, .11); }
      if (name === 'goal') [523,659,784,1047].forEach((n, i) => tone(n, .16, 'square', .16, i * .095));
      if (name === 'boss') { tone(110, .14, 'sawtooth', .25); tone(80, .18, 'square', .2, .06); }
    }

    function playMusicStep() {
      if (!audioContext || game.muted || game.state !== 'playing') return;
      const melodies = [
        [659, 784, 880, 784, 659, 523, 587, 659, 523, 587, 659, 784, 659, 587, 523, 0],
        [523, 659, 698, 784, 698, 659, 523, 392, 440, 523, 659, 587, 523, 440, 392, 0],
        [440, 523, 659, 523, 392, 440, 523, 659, 698, 659, 523, 440, 392, 330, 392, 0],
        [392, 466, 523, 622, 523, 466, 392, 311, 349, 392, 466, 523, 466, 392, 311, 0]
      ];
      const melody = melodies[game.levelIndex];
      const note = melody[musicStep % melody.length];
      if (note) tone(note, .105, 'square', .07);
      if (musicStep % 2 === 0) {
        const bassRoots = [131, 110, 98, 78];
        tone(bassRoots[game.levelIndex] * (musicStep % 8 === 6 ? 1.5 : 1), .13, 'triangle', .09);
      }
      musicStep++;
    }

    // -----------------------------------------------------------------------
    // Menus and level lifecycle
    // -----------------------------------------------------------------------
    function setLocalizedControls() {
      document.documentElement.lang = language === 'th' ? 'th' : 'en';
      jumpButton.textContent = t().jump;
      document.querySelector('#left-btn').ariaLabel = t().moveLeft;
      document.querySelector('#right-btn').ariaLabel = t().moveRight;
      jumpButton.ariaLabel = t().jumpLabel;
      muteButton.ariaLabel = game.muted ? t().unmute : t().mute;
    }

    function showScreen({ kicker = '', title = '', copy = '', help = '', actions = [], logo = false }) {
      gameShell.classList.remove('playing');
      screen.querySelector('.game-logo').style.display = logo ? '' : 'none';
      screenKicker.textContent = kicker;
      screenTitle.textContent = title;
      screenCopy.textContent = copy;
      screenHelp.textContent = help;
      screenHelp.style.display = help ? '' : 'none';
      screenActions.replaceChildren();
      actions.forEach((action, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `menu-btn${index > 0 ? ' secondary' : ''}`;
        button.textContent = action.label;
        button.addEventListener('click', action.onClick, { once: true });
        screenActions.append(button);
      });
      controls.classList.remove('active');
      screen.classList.add('visible');
      requestAnimationFrame(() => screenActions.querySelector('button')?.focus({ preventScroll: true }));
    }

    function hideScreen() {
      gameShell.classList.add('playing');
      screen.classList.remove('visible');
      controls.classList.add('active');
      canvas.focus?.();
    }

    function selectLanguage(lang) {
      language = lang;
      setLocalizedControls();
      initAudio();
      game.state = 'story';
      showScreen({
        kicker: 'SUPER NAN BROS',
        title: t().introTitle,
        copy: t().intro,
        help: t().controls,
        actions: [{ label: t().begin, onClick: () => showLevelIntro(0, true) }]
      });
    }

    function cloneLevel(index) {
      const src = LEVELS[index];
      return {
        ...src,
        platforms: src.platforms.map(p => ({ ...p })),
        foods: src.foods.map(f => ({ ...f, collected: false, phase: Math.random() * Math.PI * 2 })),
        enemies: src.enemies.map(e => ({ ...e, w: e.boss ? 64 : 39, h: e.boss ? 66 : 42, dir: Math.random() > .5 ? 1 : -1, alive: true, hp: e.boss ? 3 : 1, stun: 0 }))
      };
    }

    function resetPlayer() {
      Object.assign(player, { x: 74, y: 500, prevY: 500, vx: 0, vy: 0, onGround: false, coyote: 0, jumpBuffer: 0, airJumps: 1, jumpCutGrace: 0, jumpCutQueued: false, facing: 1, runCycle: 0 });
      game.jumpPeakY = player.y;
      game.cameraX = 0;
      clearInput();
    }

    function loadLevel(index, resetScore = false) {
      game.levelIndex = index;
      game.level = cloneLevel(index);
      if (resetScore) { game.score = 0; game.lives = 3; game.collected = 0; game.jumpCount = 0; }
      resetPlayer();
      game.particles.length = 0;
      game.shake = 0;
      musicStep = 0;
    }

    function showLevelIntro(index, first = false) {
      loadLevel(index, first);
      game.state = 'levelIntro';
      const info = t().levels[index];
      showScreen({
        kicker: info.tag,
        title: info.name,
        copy: info.story,
        help: t().controls,
        actions: [{ label: t().ready, onClick: beginLevel }]
      });
    }

    function beginLevel() {
      initAudio();
      game.state = 'playing';
      game.readyTimer = 70;
      hideScreen();
    }

    function completeLevel() {
      if (game.state !== 'playing') return;
      game.state = 'levelComplete';
      game.score += 1000 + game.lives * 150;
      sfx('goal');
      if (game.levelIndex === LEVELS.length - 1) {
        window.setTimeout(showWinScreen, 650);
        return;
      }
      const clearedCopy = t().cleared[game.levelIndex];
      window.setTimeout(() => showScreen({
        kicker: t().levelComplete,
        title: `+${1000 + game.lives * 150}`,
        copy: clearedCopy,
        actions: [{ label: t().next, onClick: () => showLevelIntro(game.levelIndex + 1) }]
      }), 500);
    }

    function showWinScreen() {
      game.state = 'win';
      showScreen({
        kicker: t().winTitle,
        title: `${t().finalScore}: ${String(game.score).padStart(6, '0')}`,
        copy: t().winCopy,
        actions: [{ label: t().playAgain, onClick: () => showLevelIntro(0, true) }]
      });
    }

    function die(reason) {
      if (game.state !== 'playing') return;
      game.state = 'dying';
      game.deathReason = reason;
      game.lives--;
      player.vy = -8;
      game.shake = 14;
      burst(player.x + player.w / 2, player.y + player.h / 2, '#ff5757', 16, 4.5);
      sfx('hurt');
      window.setTimeout(showRetryScreen, 720);
    }

    function showRetryScreen() {
      if (game.lives <= 0) {
        game.state = 'gameOver';
        showScreen({
          kicker: t().gameOver,
          title: t().gameOverCopy,
          copy: `${t().score}: ${String(game.score).padStart(6, '0')}`,
          actions: [{ label: t().restart, onClick: () => showLevelIntro(0, true) }]
        });
      } else {
        game.state = 'retry';
        showScreen({
          kicker: `${'♥'.repeat(game.lives)}${'♡'.repeat(3 - game.lives)}`,
          title: t().retryTitle,
          copy: game.deathReason === 'pit' ? t().retryPit : t().retryEnemy,
          actions: [{ label: t().retry, onClick: retryLevel }]
        });
      }
    }

    function retryLevel() {
      game.level = cloneLevel(game.levelIndex);
      resetPlayer();
      game.state = 'playing';
      game.readyTimer = 45;
      hideScreen();
    }

    // -----------------------------------------------------------------------
    // Input
    // -----------------------------------------------------------------------
    function setJump(value) {
      if (value && !input.jump) input.jumpPressed = true;
      if (!value && input.jump) input.jumpReleased = true;
      input.jump = value;
    }

    function clearInput() {
      input.left = input.right = input.jump = input.jumpPressed = input.jumpReleased = false;
      Object.values(activePointers).forEach(set => set.clear());
      document.querySelectorAll('.control-btn').forEach(button => button.classList.remove('pressed'));
    }

    const PRIMARY_JUMP_SPEED = 13.35;
    const DOUBLE_JUMP_SPEED = 12.6;

    function launchJump(isDoubleJump = false) {
      if (!isDoubleJump) game.jumpPeakY = player.y;
      player.vy = -(isDoubleJump ? DOUBLE_JUMP_SPEED : PRIMARY_JUMP_SPEED);
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
      input.jumpPressed = false;
      player.jumpCutGrace = isDoubleJump ? 24 : 3;
      player.jumpCutQueued = false;
      if (isDoubleJump) player.airJumps--;
      game.jumpCount++;
      sfx(isDoubleJump ? 'doubleJump' : 'jump');
      burst(
        player.x + player.w / 2,
        player.y + player.h,
        isDoubleJump ? '#ffd84a' : '#e9f4ff',
        isDoubleJump ? 9 : 5,
        isDoubleJump ? 2.5 : 1.8
      );
    }

    const keyMap = {
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right',
      ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
      a: 'left', A: 'left', d: 'right', D: 'right',
      w: 'jump', W: 'jump', ' ': 'jump'
    };

    function handleKeyDown(event) {
      const action = keyMap[event.code] || keyMap[event.key];
      if (!action) return;
      event.preventDefault();
      if (action === 'jump') setJump(true); else input[action] = true;
    }

    function handleKeyUp(event) {
      const action = keyMap[event.code] || keyMap[event.key];
      if (!action) return;
      event.preventDefault();
      if (action === 'jump') setJump(false); else input[action] = false;
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    function bindControl(id, action) {
      const button = document.querySelector(id);
      const sync = () => {
        const active = activePointers[action].size > 0;
        button.classList.toggle('pressed', active);
        if (action === 'jump') setJump(active); else input[action] = active;
      };
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        initAudio();
        button.setPointerCapture(event.pointerId);
        activePointers[action].add(event.pointerId);
        sync();
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => button.addEventListener(type, event => {
        activePointers[action].delete(event.pointerId);
        sync();
      }));
    }

    bindControl('#left-btn', 'left');
    bindControl('#right-btn', 'right');
    bindControl('#jump-btn', 'jump');
    document.querySelector('#left-btn').addEventListener('click', () => {
      if (game.state !== 'playing') return;
      player.vx = Math.max(-4.85, player.vx - .9);
      player.facing = -1;
    });
    document.querySelector('#right-btn').addEventListener('click', () => {
      if (game.state !== 'playing') return;
      player.vx = Math.min(4.85, player.vx + .9);
      player.facing = 1;
    });
    jumpButton.addEventListener('click', () => {
      if (game.state !== 'playing') return;
      // A click can begin and end between two animation frames (keyboard
      // activation and very quick taps do this), so launch immediately when
      // grounded. Held pointers still use the buffered/variable-height path.
      if (player.onGround || player.coyote > 0) {
        launchJump(false);
      } else if (!input.jumpReleased) {
        // Keyboard-activated clicks can request the mid-air jump directly.
        // Pointer taps already queued it during pointerdown.
        input.jumpPressed = true;
      }
    });
    window.addEventListener('blur', clearInput);
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearInput(); });

    screenActions.addEventListener('click', event => {
      const lang = event.target.closest('[data-language]')?.dataset.language;
      if (lang) selectLanguage(lang);
    });

    muteButton.addEventListener('click', () => {
      game.muted = !game.muted;
      if (masterGain) masterGain.gain.setTargetAtTime(game.muted ? 0 : .18, audioContext.currentTime, .02);
      muteButton.textContent = game.muted ? '🔇' : '🔊';
      setLocalizedControls();
      if (!game.muted) initAudio();
    });

    // -----------------------------------------------------------------------
    // Physics and collisions (fixed 60 Hz update)
    // -----------------------------------------------------------------------
    const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

    function updatePlayer() {
      const level = game.level;
      player.prevY = player.y;

      const direction = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      const acceleration = player.onGround ? .62 : .37;
      const maxSpeed = game.levelIndex === 2 ? 5.35 : 4.85;
      if (direction) {
        player.vx += direction * acceleration;
        player.facing = direction;
      } else if (player.onGround) {
        player.vx *= level.friction;
      } else {
        player.vx *= .992;
      }
      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
      if (Math.abs(player.vx) < .025) player.vx = 0;

      if (input.jumpPressed) player.jumpBuffer = 8;
      else player.jumpBuffer = Math.max(0, player.jumpBuffer - 1);
      if (player.onGround) {
        player.coyote = 7;
        player.airJumps = 1;
      } else {
        player.coyote = Math.max(0, player.coyote - 1);
      }

      if (player.jumpBuffer > 0 && (player.coyote > 0 || player.airJumps > 0)) {
        launchJump(player.coyote <= 0);
      }
      if (input.jumpReleased) player.jumpCutQueued = true;
      player.jumpCutGrace = Math.max(0, player.jumpCutGrace - 1);
      if (player.jumpCutQueued && player.jumpCutGrace === 0) {
        if (player.vy < -4.1) player.vy *= .65;
        player.jumpCutQueued = false;
      }

      player.vy = Math.min(14.5, player.vy + .64);

      // Horizontal platform collision.
      player.x += player.vx;
      for (const platform of level.platforms) {
        if (!overlaps(player, platform)) continue;
        if (player.vx > 0) player.x = platform.x - player.w;
        else if (player.vx < 0) player.x = platform.x + platform.w;
        player.vx = 0;
      }

      // Vertical platform collision.
      player.onGround = false;
      player.y += player.vy;
      game.jumpPeakY = Math.min(game.jumpPeakY, player.y);
      for (const platform of level.platforms) {
        if (!overlaps(player, platform)) continue;
        if (player.vy >= 0 && player.prevY + player.h <= platform.y + 9) {
          player.y = platform.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.airJumps = 1;
        } else if (player.vy < 0 && player.prevY >= platform.y + platform.h - 8) {
          player.y = platform.y + platform.h;
          player.vy = 0;
        }
      }

      player.x = Math.max(0, Math.min(level.width - player.w, player.x));
      if (player.y > 745) die('pit');
      if (direction && player.onGround) player.runCycle += Math.abs(player.vx) * .14;

      input.jumpPressed = false;
      input.jumpReleased = false;
    }

    function updateEnemies() {
      for (const enemy of game.level.enemies) {
        if (!enemy.alive) continue;
        if (enemy.stun > 0) { enemy.stun--; continue; }
        const pace = enemy.speed * (enemy.boss && enemy.hp === 1 ? 1.55 : 1);
        enemy.x += enemy.dir * pace;
        if (enemy.x <= enemy.min || enemy.x + enemy.w >= enemy.max) {
          enemy.dir *= -1;
          enemy.x = Math.max(enemy.min, Math.min(enemy.max - enemy.w, enemy.x));
        }

        if (!overlaps(player, enemy)) continue;
        const previousBottom = player.prevY + player.h;
        const stomped = player.vy > 1.5 && previousBottom <= enemy.y + 14 && player.y + player.h <= enemy.y + enemy.h * .72;
        if (stomped) {
          enemy.hp--;
          player.y = enemy.y - player.h;
          player.vy = enemy.boss ? -11.2 : -9.4;
          player.airJumps = 1;
          enemy.stun = enemy.boss ? 48 : 0;
          game.shake = enemy.boss ? 11 : 5;
          burst(enemy.x + enemy.w / 2, enemy.y + 6, enemy.boss ? '#ff6b35' : '#ffd84a', enemy.boss ? 18 : 10, enemy.boss ? 4.2 : 2.8);
          if (enemy.hp <= 0) {
            enemy.alive = false;
            game.score += enemy.boss ? 2500 : 250;
            game.collected += enemy.boss ? 3 : 0;
          } else {
            enemy.dir *= -1;
            game.score += 500;
          }
          sfx(enemy.boss ? 'boss' : 'stomp');
        } else {
          die('enemy');
        }
      }
    }

    function updateFoods() {
      for (const food of game.level.foods) {
        if (food.collected) continue;
        const box = { x: food.x - 12, y: food.y - 12, w: 24, h: 24 };
        if (overlaps(player, box)) {
          food.collected = true;
          game.collected++;
          game.score += 100;
          burst(food.x, food.y, '#ffd84a', 10, 2.7);
          sfx('food');
        }
      }
    }

    function bossAlive() {
      return game.levelIndex === 3 && game.level.enemies.some(enemy => enemy.boss && enemy.alive);
    }

    function updateGoal() {
      if (player.x + player.w < game.level.goalX) return;
      if (bossAlive()) {
        player.x = game.level.goalX - player.w - 8;
        player.vx = -2.2;
        game.shake = 3;
        return;
      }
      completeLevel();
    }

    function burst(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = speed * (.45 + Math.random() * .7);
        game.particles.push({ x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity - 1, life: 28 + Math.random() * 25, color, size: 2 + Math.random() * 4 });
      }
    }

    function updateParticles() {
      for (const p of game.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .14;
        p.life--;
      }
      game.particles = game.particles.filter(p => p.life > 0);
    }

    function update() {
      game.time++;
      if (game.shake > 0) game.shake *= .82;
      updateParticles();
      if (game.state !== 'playing') {
        if (game.state === 'dying') { player.y += player.vy; player.vy += .72; }
        return;
      }
      if (game.readyTimer > 0) { game.readyTimer--; return; }
      updatePlayer();
      if (game.state !== 'playing') return;
      updateEnemies();
      if (game.state !== 'playing') return;
      updateFoods();
      updateGoal();
      const targetCamera = Math.max(0, Math.min(game.level.width - canvas.width, player.x - 155));
      game.cameraX += (targetCamera - game.cameraX) * .11;
    }

    // -----------------------------------------------------------------------
    // Pixel-inspired rendering
    // -----------------------------------------------------------------------
    const COLORS = {
      navy: '#102a56', cream: '#fff8e8', orange: '#e96322', orangeDark: '#94321d',
      grass: '#43a047', grassDark: '#24713a', gold: '#ffd84a', sky: '#5c94fc'
    };

    function rect(x, y, w, h, fill, stroke = null, lineWidth = 2) {
      ctx.fillStyle = fill;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.strokeRect(Math.round(x) + lineWidth / 2, Math.round(y) + lineWidth / 2, Math.round(w) - lineWidth, Math.round(h) - lineWidth);
      }
    }

    function drawCloud(x, y, scale = 1) {
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      const unit = 12 * scale;
      ctx.fillRect(Math.round(x), Math.round(y + unit), Math.round(unit * 5), Math.round(unit * 1.45));
      ctx.fillRect(Math.round(x + unit), Math.round(y), Math.round(unit * 2), Math.round(unit * 2));
      ctx.fillRect(Math.round(x + unit * 2.7), Math.round(y + unit * .55), Math.round(unit * 1.45), Math.round(unit * 1.5));
      ctx.fillStyle = 'rgba(174,218,255,.7)';
      ctx.fillRect(Math.round(x + unit * .5), Math.round(y + unit * 2.18), Math.round(unit * 4), Math.max(2, Math.round(3 * scale)));
    }

    function drawHill(x, base, w, h, color, spots) {
      ctx.fillStyle = color;
      ctx.strokeStyle = COLORS.navy;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + w / 2, base - h * 1.55, x + w, base);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = spots;
      for (let i = 1; i < 5; i++) {
        ctx.fillRect(Math.round(x + (w * i) / 5), Math.round(base - h * (.18 + (i % 2) * .25)), 7, 12);
      }
    }

    function drawBackground() {
      const level = game.level || LEVELS[game.levelIndex];
      const theme = level.theme;
      const palettes = {
        day: ['#5c94fc', '#2d75df', '#66bb5a', '#2f8f4e'],
        sunset: ['#f58b4a', '#6a55b8', '#c95953', '#66468f'],
        night: ['#172b62', '#081a43', '#355b78', '#203d61'],
        pantry: ['#29355f', '#121936', '#5b496e', '#392d55']
      };
      const palette = palettes[theme];
      const gradient = ctx.createLinearGradient(0, 0, 0, 620);
      gradient.addColorStop(0, palette[0]);
      gradient.addColorStop(1, palette[1]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (theme === 'night' || theme === 'pantry') {
        ctx.fillStyle = '#f5f3bd';
        for (let i = 0; i < 30; i++) {
          const x = (i * 83 + 27) % 500;
          const y = 78 + (i * 47) % 300;
          const s = i % 5 === 0 ? 3 : 2;
          ctx.fillRect(x, y, s, s);
        }
        ctx.fillStyle = theme === 'night' ? '#f5f0c4' : '#e9d3a0';
        ctx.beginPath();
        ctx.arc(386, 132, theme === 'night' ? 35 : 23, 0, Math.PI * 2);
        ctx.fill();
      } else {
        drawCloud(35 - (game.cameraX * .08) % 560, 132, .92);
        drawCloud(320 - (game.cameraX * .045) % 650, 208, .72);
        drawCloud(165 - (game.cameraX * .12) % 720, 78, .55);
      }

      const parallax = -(game.cameraX * .18) % 530;
      drawHill(parallax - 130, 600, 280, 165, palette[2], palette[3]);
      drawHill(parallax + 100, 600, 330, 205, palette[2], palette[3]);
      drawHill(parallax + 410, 600, 270, 150, palette[2], palette[3]);

      // Deep water/void is always visible through real platform gaps.
      rect(0, GROUND_Y, 480, 146, theme === 'night' ? '#071635' : '#0a2f72');
      ctx.fillStyle = theme === 'sunset' ? '#8c3f6b' : '#1450aa';
      for (let y = GROUND_Y + 8; y < 720; y += 18) {
        for (let x = -12; x < 500; x += 34) {
          ctx.fillRect(x + ((y / 18) % 2) * 11, y, 18, 5);
        }
      }
    }

    function drawPlatform(platform) {
      const x = platform.x;
      if (platform.kind === 'ice') {
        rect(x, platform.y, platform.w, platform.h, '#bcecff', COLORS.navy, 3);
        rect(x + 4, platform.y + 4, platform.w - 8, 6, '#f7ffff');
        for (let px = x + 16; px < x + platform.w - 8; px += 34) {
          ctx.strokeStyle = '#5ea9d5'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px, platform.y + 12); ctx.lineTo(px + 9, platform.y + 20); ctx.stroke();
        }
        return;
      }
      rect(x, platform.y, platform.w, platform.h, COLORS.orange, COLORS.navy, 3);
      if (platform.kind === 'ground') {
        rect(x + 2, platform.y + 2, platform.w - 4, 13, COLORS.grass);
        rect(x + 3, platform.y + 13, platform.w - 6, 6, COLORS.grassDark);
      }
      const startY = platform.y + (platform.kind === 'ground' ? 20 : 2);
      for (let y = startY; y < platform.y + platform.h; y += 24) {
        ctx.strokeStyle = COLORS.orangeDark;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + platform.w, y); ctx.stroke();
        const offset = ((y - startY) / 24) % 2 ? 13 : 31;
        for (let px = x + offset; px < x + platform.w; px += 48) {
          ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, Math.min(y + 24, platform.y + platform.h)); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(x + 5, startY + 5, Math.max(0, platform.w - 10), 4);
    }

    function drawFood(food) {
      if (food.collected) return;
      const bob = Math.sin(game.time * .08 + food.phase) * 4;
      const x = food.x;
      const y = food.y + bob;
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      ctx.strokeStyle = COLORS.navy;
      ctx.lineWidth = 3;
      if (food.kind === 0) { // apple
        ctx.fillStyle = '#f04a3e'; ctx.beginPath(); ctx.arc(-5, 2, 9, 0, Math.PI * 2); ctx.arc(5, 2, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        rect(-1, -15, 4, 8, '#6b431f'); rect(3, -13, 8, 5, '#55a844');
      } else if (food.kind === 1) { // cheese
        ctx.fillStyle = COLORS.gold; ctx.beginPath(); ctx.moveTo(-12, 11); ctx.lineTo(12, 11); ctx.lineTo(9, -10); ctx.lineTo(-8, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#d99e21'; ctx.beginPath(); ctx.arc(3, 2, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (food.kind === 2) { // carrot
        ctx.fillStyle = '#f57c2c'; ctx.beginPath(); ctx.moveTo(-9, -5); ctx.lineTo(10, -5); ctx.lineTo(0, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
        rect(-7, -13, 6, 9, '#4fa346', COLORS.navy, 2); rect(2, -15, 6, 11, '#4fa346', COLORS.navy, 2);
      } else { // bread
        ctx.fillStyle = '#efb54d'; ctx.beginPath(); ctx.roundRect(-12, -10, 24, 22, 7); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#fff0a9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(-7, 4); ctx.moveTo(4, -6); ctx.lineTo(1, 5); ctx.stroke();
      }
      ctx.restore();
    }

    function drawCharacter(entity, image, isPlayer = false) {
      const fallbackColor = isPlayer ? '#e34c9b' : '#4aa44f';
      const movingBob = isPlayer && player.onGround ? Math.sin(player.runCycle) * 2 : 0;
      ctx.save();
      ctx.translate(Math.round(entity.x + entity.w / 2), Math.round(entity.y + movingBob));
      const facing = isPlayer ? player.facing : -(entity.dir || 1);
      ctx.scale(facing, 1);

      // Pixel shoes/body ground the supplied portrait in the platform world.
      rect(-entity.w * .42, entity.h - 13, entity.w * .84, 14, isPlayer ? '#2854a8' : '#23763a', COLORS.navy, 3);
      rect(-entity.w * .5, entity.h - 4, entity.w * .38, 7, '#6f3b20', COLORS.navy, 2);
      rect(entity.w * .12, entity.h - 4, entity.w * .38, 7, '#6f3b20', COLORS.navy, 2);

      if (image.complete && image.naturalWidth > 0) {
        const faceW = entity.boss ? 76 : 54;
        const faceH = entity.boss ? 83 : 72;
        ctx.drawImage(image, -faceW / 2, entity.boss ? -25 : -24, faceW, faceH);
      } else {
        rect(-entity.w / 2, 1, entity.w, entity.h - 7, fallbackColor, COLORS.navy, 3);
        ctx.scale(facing, 1);
        ctx.fillStyle = '#fff';
        ctx.font = `900 ${entity.boss ? 28 : 20}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(isPlayer ? 'N' : 'Z', 0, entity.h * .6);
      }
      ctx.restore();
    }

    function drawEnemy(enemy) {
      if (!enemy.alive) return;
      if (enemy.stun > 0 && Math.floor(enemy.stun / 4) % 2 === 0) ctx.globalAlpha = .45;
      drawCharacter(enemy, zacImage, false);
      ctx.globalAlpha = 1;
      if (enemy.boss) {
        const width = 74;
        rect(enemy.x + enemy.w / 2 - width / 2, enemy.y - 39, width, 9, '#301b2d', COLORS.navy, 2);
        rect(enemy.x + enemy.w / 2 - width / 2 + 2, enemy.y - 37, (width - 4) * (enemy.hp / 3), 5, '#ff5a3d');
      }
    }

    function drawGoal() {
      const x = game.level.goalX;
      const locked = bossAlive();
      rect(x + 34, 434, 88, 140, locked ? '#3e3857' : '#c79a60', COLORS.navy, 4);
      rect(x + 54, 489, 48, 85, locked ? '#241f39' : '#6d3a28', COLORS.navy, 3);
      rect(x, 398, 7, 176, '#f7e2a6', COLORS.navy, 2);
      ctx.fillStyle = locked ? '#9aa2b5' : '#f24e35';
      ctx.strokeStyle = COLORS.navy; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + 7, 406); ctx.lineTo(x + 58, 423); ctx.lineTo(x + 7, 444); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (locked) {
        rect(x + 67, 513, 22, 24, '#ffd84a', COLORS.navy, 3);
        ctx.fillStyle = COLORS.navy; ctx.font = '900 10px Arial'; ctx.textAlign = 'center'; ctx.fillText('!', x + 78, 530);
      }
    }

    function drawParticles() {
      for (const p of game.particles) {
        ctx.globalAlpha = Math.min(1, p.life / 14);
        rect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size, p.color);
      }
      ctx.globalAlpha = 1;
    }

    function drawWorld() {
      const shakeX = game.shake > .5 ? (Math.random() - .5) * game.shake : 0;
      const shakeY = game.shake > .5 ? (Math.random() - .5) * game.shake * .55 : 0;
      ctx.save();
      ctx.translate(Math.round(-game.cameraX + shakeX), Math.round(shakeY));
      for (const platform of game.level.platforms) drawPlatform(platform);
      drawGoal();
      for (const food of game.level.foods) drawFood(food);
      for (const enemy of game.level.enemies) drawEnemy(enemy);
      drawCharacter(player, nanImage, true);
      drawParticles();
      ctx.restore();
    }

    function drawHUD() {
      const copy = t();
      ctx.save();
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = COLORS.navy;
      ctx.lineWidth = 4;
      ctx.font = '900 15px "Arial Black", Arial';
      const hudText = `${copy.world} ${game.levelIndex + 1}-1`;
      ctx.strokeText(hudText, 14, 16); ctx.fillText(hudText, 14, 16);
      const foodText = `${copy.food} ${String(game.collected).padStart(2, '0')}`;
      ctx.strokeText(foodText, 182, 16); ctx.fillText(foodText, 182, 16);
      const scoreText = `${copy.score} ${String(game.score).padStart(6, '0')}`;
      ctx.textAlign = 'right'; ctx.strokeText(scoreText, 468, 16); ctx.fillText(scoreText, 468, 16);
      ctx.textAlign = 'left';
      ctx.font = '900 21px Arial';
      ctx.strokeText(`${'♥'.repeat(game.lives)}${'♡'.repeat(3 - game.lives)}`, 14, 42); ctx.fillStyle = '#ff5b4d'; ctx.fillText(`${'♥'.repeat(game.lives)}${'♡'.repeat(3 - game.lives)}`, 14, 42);

      // Progress rail.
      rect(170, 50, 238, 8, 'rgba(9,29,66,.48)', '#fff', 2);
      const progress = Math.max(0, Math.min(1, player.x / game.level.goalX));
      rect(172, 52, 234 * progress, 4, COLORS.gold);
      ctx.fillStyle = '#fff'; ctx.font = '900 11px Arial'; ctx.textAlign = 'right';
      ctx.fillText('⚑', 423, 46);

      if (game.levelIndex === 3 && bossAlive() && player.x > 2180) {
        ctx.textAlign = 'center';
        ctx.fillStyle = COLORS.gold;
        ctx.strokeStyle = COLORS.navy;
        ctx.lineWidth = 4;
        ctx.font = '900 14px "Arial Black", Arial';
        ctx.strokeText(copy.bossHint, 240, 79); ctx.fillText(copy.bossHint, 240, 79);
      }

      if (game.readyTimer > 0) {
        const label = game.readyTimer > 26 ? copy.ready : copy.go;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 44px "Arial Black", Arial';
        ctx.fillStyle = COLORS.cream;
        ctx.strokeStyle = COLORS.navy;
        ctx.lineWidth = 8;
        ctx.strokeText(label, 240, 294); ctx.fillText(label, 240, 294);
      }
      ctx.restore();
    }

    function drawTitleBackdrop() {
      game.cameraX = (game.time * .35) % 520;
      drawBackground();
      ctx.save(); ctx.translate(-game.cameraX, 0);
      drawPlatform(makePlatform(0, 574, 1180));
      ctx.restore();
    }

    function render() {
      canvas.dataset.state = game.state;
      canvas.dataset.level = String(game.levelIndex + 1);
      canvas.dataset.playerX = player.x.toFixed(1);
      canvas.dataset.playerY = player.y.toFixed(1);
      canvas.dataset.score = String(game.score);
      canvas.dataset.nanAsset = nanImage.complete && nanImage.naturalWidth > 0 ? 'loaded' : 'fallback';
      canvas.dataset.zacAsset = zacImage.complete && zacImage.naturalWidth > 0 ? 'loaded' : 'fallback';
      canvas.dataset.jumps = String(game.jumpCount);
      canvas.dataset.airJumps = String(player.airJumps);
      canvas.dataset.jumpPeakY = game.jumpPeakY.toFixed(1);
      drawBackground();
      if (game.level) {
        drawWorld();
        drawHUD();
      } else {
        drawTitleBackdrop();
      }
    }

    // Fixed timestep keeps physics consistent across 60/120 Hz screens.
    let lastTime = performance.now();
    let accumulator = 0;
    const STEP = 1000 / 60;
    function frame(now) {
      const elapsed = Math.min(50, now - lastTime);
      lastTime = now;
      accumulator += elapsed;
      while (accumulator >= STEP) {
        update();
        accumulator -= STEP;
      }
      render();
      requestAnimationFrame(frame);
    }

    // Lightweight testing hook for automated smoke tests; no game UI depends on it.
    window.__superNan = {
      game,
      player,
      chooseLanguage: selectLanguage,
      beginLevel,
      skipToLevel(index) { showLevelIntro(Math.max(0, Math.min(3, index))); },
      completeLevel
    };

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
