<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super NAN Bros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; background:#111; color:#fff; font-family: system-ui, monospace; overflow:hidden; }
  #game-container { position:relative; max-width:480px; margin:0 auto; background:#000; }
  canvas { 
    display:block; 
    width:100%; 
    max-width:480px;
    height:auto;
    border: none;
    image-rendering: crisp-edges;
    background:#5c94fc;
  }
  #ui {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.6); padding:6px 16px; border-radius:6px;
    font-size:15px; display:flex; gap:20px; z-index:10;
  }
  #touch-controls {
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 15px; z-index:20;
  }
  .touch-btn {
    width:64px; height:64px;
    background:rgba(255,255,255,0.15);
    border:3px solid #0f0;
    border-radius:12px;
    color:#0f0;
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .touch-btn:active { background:#0f0; color:#000; }
  #jump-btn { width:76px; height:76px; font-size:32px; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="ui">
    <div>Level <span id="level">1</span></div>
    <div>Score <span id="score">0</span></div>
  </div>

  <div id="touch-controls">
    <div style="display:flex; gap:10px;">
      <div class="touch-btn" id="left-btn">◀</div>
      <div class="touch-btn" id="right-btn">▶</div>
    </div>
    <div class="touch-btn" id="jump-btn">▲</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Images with fallback
let playerImgLoaded = false;
let enemyImgLoaded = false;

const PLAYER_IMG = new Image();
PLAYER_IMG.onload = () => { playerImgLoaded = true; };
PLAYER_IMG.onerror = () => { playerImgLoaded = false; };
PLAYER_IMG.src = '../../assets/nan/enemy.png';

const ENEMY_IMG = new Image();
ENEMY_IMG.onload = () => { enemyImgLoaded = true; };
ENEMY_IMG.onerror = () => { enemyImgLoaded = false; };
ENEMY_IMG.src = '../tower-defense/assets/zac.png';

let audioCtx;
let musicInterval = null;

let player = { x: 60, y: 480, vx: 0, vy: 0, width: 36, height: 36, onGround: false, facingLeft: false };
let cameraX = 0;
let score = 0;
let currentLevel = 1;
let gameState = 'start';
let keys = {};
let coins = [];
let enemies = [];
let platforms = [];
let pits = [];

// Levels with gaps
const levels = [
  {
    platforms: [
      {x:0, y:620, w:200, h:100}, {x:260, y:620, w:180, h:100},
      {x:500, y:620, w:200, h:100}, {x:760, y:620, w:280, h:100},
      {x:180, y:510, w:70, h:18}, {x:400, y:450, w:80, h:18}, {x:620, y:370, w:90, h:18}
    ],
    pits: [{x:200, w:60}, {x:460, w:40}, {x:700, w:60}],
    enemies: [{x:300, y:580, range:50}, {x:560, y:580, range:55}],
    coins: [{x:210, y:470}, {x:430, y:410}, {x:660, y:330}],
    goalX: 980
  },
  {
    platforms: [
      {x:0, y:620, w:150, h:100}, {x:200, y:620, w:130, h:100}, {x:380, y:620, w:150, h:100},
      {x:590, y:620, w:170, h:100}, {x:820, y:620, w:200, h:100},
      {x:160, y:500, w:55, h:18}, {x:340, y:430, w:65, h:18}, {x:530, y:370, w:70, h:18}
    ],
    pits: [{x:150, w:50}, {x:330, w:50}, {x:560, w:30}, {x:760, w:60}],
    enemies: [{x:260, y:580, range:60}, {x:480, y:580, range:45}, {x:700, y:580, range:50}],
    coins: [{x:180, y:460}, {x:370, y:390}, {x:560, y:330}, {x:850, y:580}],
    goalX: 1000
  }
];

let currentLevelData = levels[0];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type='square', vol=0.3) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = vol;
  const d = audioCtx.createGain();
  d.gain.value = 1;
  d.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  o.connect(g); g.connect(d); d.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + duration + 0.05);
}

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  initAudio();
  let i = 0;
  const notes = [262,294,330,349,392,440,494,523];
  musicInterval = setInterval(() => {
    if (gameState !== 'playing') return;
    playSound(notes[i % notes.length], 0.15, 'square', 0.2);
    if (i % 3 === 0) playSound(notes[i % notes.length] * 0.5, 0.2, 'sawtooth', 0.1);
    i++;
  }, 150);
}

function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }

function loadLevel(n) {
  currentLevel = n;
  currentLevelData = levels[n-1];
  player.x = 60; player.y = 480; player.vx = 0; player.vy = 0; cameraX = 0;
  platforms = currentLevelData.platforms.map(p => ({...p}));
  pits = currentLevelData.pits.map(p => ({...p}));
  enemies = currentLevelData.enemies.map(e => ({x:e.x, y:e.y, width:30, height:30, vx:1, startX:e.x, range:e.range, alive:true}));
  coins = currentLevelData.coins.map(c => ({x:c.x, y:c.y, width:16, height:16, collected:false}));
}

// Input
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && gameState === 'start') startGame();
  if (e.key === ' ' && gameState === 'levelComplete') nextLevel();
  if ((e.key === 'r' || e.key === 'R') && gameState === 'gameOver') restartGame();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function setupControls() {
  const left = document.getElementById('left-btn');
  const right = document.getElementById('right-btn');
  const jump = document.getElementById('jump-btn');

  function bind(el, key) {
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; if (gameState==='start') startGame(); });
    el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('mousedown', e => { e.preventDefault(); keys[key] = true; if (gameState==='start') startGame(); });
    el.addEventListener('mouseup', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('mouseleave', () => keys[key] = false);
  }

  bind(left, 'ArrowLeft');
  bind(right, 'ArrowRight');
  bind(jump, ' ');

  canvas.addEventListener('touchstart', e => {
    if (gameState === 'playing' && player.onGround) {
      player.vy = -12;
      player.onGround = false;
      playSound(700, 0.07);
    }
  });
}

function update() {
  if (gameState !== 'playing') return;

  const speed = 4.5;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.vx = -speed; player.facingLeft = true; }
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.vx = speed; player.facingLeft = false; }
  else { player.vx *= 0.8; }

  if ((keys[' '] || keys['Space'] || keys['w'] || keys['W']) && player.onGround) {
    player.vy = -12;
    player.onGround = false;
    playSound(700, 0.07);
  }

  player.vy += 0.7;
  if (player.vy > 12) player.vy = 12;

  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;
  for (let p of platforms) {
    if (player.x < p.x + p.w && player.x + player.width > p.x && player.y + player.height > p.y && player.y < p.y + p.h) {
      if (player.vy > 0) { player.y = p.y - player.height; player.vy = 0; player.onGround = true; }
      else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }

  for (let pit of pits) {
    if (player.x + player.width > pit.x && player.x < pit.x + pit.w && player.y > 650) die();
  }

  if (player.x < 0) player.x = 0;
  if (player.y > 780) die();

  // Enemies
  for (let en of enemies) {
    if (!en.alive) continue;
    en.x += en.vx;
    if (en.x > en.startX + en.range || en.x < en.startX - en.range) en.vx *= -1;

    if (player.x < en.x + en.width && player.x + player.width > en.x &&
        patient.y < en.y + en.height && player.y + player.height > en.y) {
      if (patient.vy > 0 && player.y + patient.height - 6 < en.y + 6) {
        en.alive = false;
        player.vy = -9;
        score += 120;
      } else {
        die();
      }
    }
  }

  // Coins
  for (let c of coins) {
    if (c.collected) continue;
    if (player.x < c.x + c.width && player.x + player.width > c.x &&
        patient.y < c.y + c.height && patient.y + player.height > c.y) {
      c.collected = true;
      score += 60;
      playSound(1200, 0.06);
    }
  }

  cameraX = Math.max(0, player.x - 130);

  if (player.x > currentLevelData.goalX) {
    gameState = 'levelComplete';
    score += 300;
    stopMusic();
  }
}

function draw() {
  // Sky
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Platforms
  ctx.fillStyle = '#c84c0c';
  for (let p of platforms) {
    ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
    ctx.strokeStyle = '#8c2f00';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - cameraX, p.y, p.w, p.h);
  }

  // Pits
  ctx.fillStyle = '#222';
  for (let pit of pits) {
    ctx.fillRect(pit.x - cameraX, 620, pit.w, 100);
  }

  // Coins
  ctx.fillStyle = '#ffcc00';
  for (let c of coins) {
    if (!c.collected) {
      ctx.beginPath();
      ctx.arc(c.x - cameraX + 8, c.y + 8, 7, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Enemies
  for (let en of enemies) {
    if (!en.alive) continue;
    if (enemyImgLoaded && ENEMY_IMG.complete) {
      ctx.drawImage(ENEMY_IMG, en.x - cameraX, en.y, en.width, en.height);
    } else {
      ctx.fillStyle = '#e33';
      ctx.fillRect(en.x - cameraX, en.y, en.width, en.height);
    }
  }

  // Player
  if (playerImgLoaded && PLAYER_IMG.complete) {
    ctx.save();
    if (player.facingLeft) {
      ctx.translate(player.x - cameraX + player.width, player.y);
      ctx.scale(-1, 1);
      ctx.drawImage(PLAYER_IMG, 0, 0, player.width, player.height);
    } else {
      ctx.drawImage(PLAYER_IMG, player.x - cameraX, player.y, player.width, player.height);
    }
    ctx.restore();
  } else {
    ctx.fillStyle = '#4a4';
    ctx.fillRect(player.x - cameraX, player.y, player.width, player.height);
  }

  // Goal
  ctx.fillStyle = '#0a0';
  ctx.fillRect(currentLevelData.goalX - cameraX, 540, 40, 80);

  // Start screen
  if (gameState === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 200, canvas.width, 320);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 32px monospace';
    ctx.fillText('SUPER NAN BROS', 95, 280);
    ctx.font = '16px monospace';
    ctx.fillText('Tap buttons or press SPACE', 105, 330);
    ctx.fillText('Jump on enemies • Avoid holes', 90, 360);
    ctx.fillText('Press SPACE or tap to start', 100, 420);
  }

  if (gameState === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 240, canvas.width, 240);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('LEVEL COMPLETE!', 110, 320);
    ctx.font = '16px monospace';
    ctx.fillText('Tap or SPACE for next level', 95, 370);
  }

  if (gameState === 'gameOver') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 240, canvas.width, 240);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 32px monospace';
    ctx.fillText('GAME OVER', 140, 320);
    ctx.font = '16px monospace';
    ctx.fillText('Press R to restart', 150, 370);
  }
}

function updateUI() {
  document.getElementById('level').textContent = currentLevel;
  document.getElementById('score').textContent = score;
}

function gameLoop() {
  update();
  draw();
  updateUI();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  if (gameState !== 'start') return;
  gameState = 'playing';
  loadLevel(1);
  startMusic();
}

function nextLevel() {
  if (currentLevel < levels.length) {
    loadLevel(currentLevel + 1);
    gameState = 'playing';
    startMusic();
  }
}

function restartGame() {
  score = 0;
  loadLevel(1);
  gameState = 'start';
  stopMusic();
}

function setupControls() {
  // already defined above
}

function boot() {
  setupControls();
  loadLevel(1);
  gameLoop();
  // Force a draw in case of issues
  setTimeout(() => { if (gameState === 'start') draw(); }, 200);
}

boot();
</script>

</body>
</html>
